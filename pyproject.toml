[project]
name = "strade"
version = "0.1.0"
description = "Extract distinct named Italian streets from an OpenStreetMap dump"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "osmium>=4.3.1",
    "pyproj>=3.7.2",
    "shapely>=2.1.2",
    "tqdm>=4.67.1",
]

[project.scripts]
strade = "strade.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strade"]

[tool.unittest]
start-directory = "tests"
pattern = "test_*.py"

[tool.ruff]
line-length = 90

[tool.ruff.lint]
extend-select = [
    "F",
    "W",
    "E",
    "I",
    "UP",
    "C4",
    "FA",
    "ISC",
    "ICN",
    "RET",
    "SIM",
    "TID",
    "TC",
    "PTH",
    "NPY",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "ty>=0.0.77",
]
